name: iOS framework check

# Compile-only gate for everything Xcode-side reviewers cannot check on Linux:
# the shared Kotlin/Native framework (commonMain + iosMain). No tests, no
# signing, no iosApp packaging yet — that comes once this step is green.
on:
  push:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'

jobs:
  ios-framework:
    name: Compile shared iOS framework
    runs-on: macos-latest
    env:
      # Debug builds do not require a real client id; keep it explicit anyway.
      ANILIST_CLIENT_ID: ci-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchains
        run: |
          xcodebuild -version
          swift --version
          java -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Link debug iOS simulator framework
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
